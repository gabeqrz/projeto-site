/* Container da Tabela Nutricional */
.tabela-nutricional {
    width: 100%;
    max-width: 350px;
    border: 2px solid #333;
    border-collapse: collapse;
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #333;
    background-color: #fff;
    margin: 20px 0;
}

/* Título da Tabela */
.tabela-nutricional caption {
    font-weight: bold;
    font-size: 16px;
    text-align: left;
    padding: 8px 10px;
    background-color: #2c5e3b; /* Verde escuro combinando com o tema vegetariano */
    color: #fff;
    border-bottom: 2px solid #333;
}

/* Cabeçalho da Tabela */
.tabela-nutricional th {
    background-color: #f2f2f2;
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid #333;
    font-size: 13px;
}

/* Células da Tabela */
.tabela-nutricional td {
    padding: 6px 10px;
    border-bottom: 1px solid #ddd;
}

/* Efeito zebrado nas linhas (opcional, para facilitar a leitura) */
.tabela-nutricional tbody tr:nth-child(even) {
    background-color: #fafafa;
}

/* Rodapé com as observações do %VD */
.tabela-nutricional tfoot td {
    font-size: 11px;
    color: #666;
    padding: 8px 10px;
    border-top: 1px solid #333;
    line-height: 1.3;
}
